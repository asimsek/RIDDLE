schema: 1
inputs:
  features: [m1, delta_m, tau21_j1, tau21_j2]
  deltaR_features: [deltaR]
  mass_column: mjj
  label_column: label
riddle:
  mass_conditioning: true
  background_correction: bgcorr_40_reguide
  fits: 10
  epochs: 100
  fractions: [learned]
  initialization: background
  enhancements:
    rosenblatt: true
    guided_fit: true
    hard_bg: true
    contrastive_fit: true
    score_flow: false
    coherent_mixture: true
    guide_epochs: 20
    guide_warmup_epochs: 10
    hard_start_epoch: 5
    hard_pool_fraction: 0.25
    hard_sampling_fraction: 0.5
    contrastive_strength: 1.0
    score_flow_epochs: 60
    rosenblatt_bins: 12
    rosenblatt_hidden: 64
    rosenblatt_bound: 8.0
  fit_recovery:
    max_retries: 2
    validation_sigma: 2.0
  flow:
    layers: 6
    hidden_features: 64
    num_blocks: 2
    use_residual_blocks: false
    use_batch_norm: true
    dropout_probability: 0.2
    activation: leaky_relu
    random_mask: true
    num_bins: 8
    tails: linear
    tail_bound: 8
    min_bin_width: 0.000001
    min_bin_height: 0.000001
    min_derivative: 0.000001
  training:
    batch_size: 256
    validation_batch_size: 1280
    learning_rate: 0.0003
    weight_decay: 0.01
    gradient_clip_norm: 1
    selected_checkpoints: 10
background:
  configuration:
    ModelType: MAF
    Transform: Affine
    num_inputs: 4
    num_cond_inputs: 1
    num_blocks: 15
    num_hidden: 128
    activation_function: relu
    pre_exp_tanh: false
    affine_log_scale_bound: 2.0
    batch_norm: true
    batch_norm_momentum: 1
    optimizer:
      name: Adam
      lr: 0.0001
      weight_decay: 0.000001
  epochs: 100
  batch_size: 256
  reference_samples: 267000
injection_scan:
  signal_events: [1000, 667, 500, 333, 250, 167, 83]
  replicas: 10
  preparation_seed: 1001
  training_seed: 42
