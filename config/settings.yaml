schema: 1
inputs:
  features: [m1, delta_m, tau21_j1, tau21_j2]
  deltaR_features: [deltaR]
  mass_column: mjj
  label_column: label
riddle:
  core: stein_witness
  mass_conditioning: true
  background_correction: bgcorr_40_reguide
  sr_closure: on
  ensemble_completion: strict
  ensemble_fit_selection: all
  ensemble_fit_count: 20
  fits: 20
  epochs: 100
  fractions: [learned]
  stein:
    hidden_features: 128
    hidden_layers: 3
    activation: silu
    witness_regularization: 1.0
    potential_center_strength: 0.0
    data_tail_fraction: 0.1
    closure_samples: 4096
    closure_sigma: 5.0
    closure_mass_bins: 8
    ensemble_fit_selection: all-valid
    scoring:
      mode: tail_focus
      auto_switch:
        enabled: {riddle: false, iad: false, supervised: false}
        fallback: {riddle: tail_focus, iad: tail_focus, supervised: potential_qnorm}
        reference_c_samples: 131072
        efficiencies: [0.004, 0.01, 0.05, 0.1]
        weights: [0.5, 0.3, 0.15, 0.05]
        confidence: 0.99
        bootstrap_replicas: 4000
        min_tail_events: 50
        seed: 75501
        background_control: true
        require_all_working_points: true
      reference_samples: 524288
      reference_split: 0.5
      mass_bins: 8
      energy_weight: 1.5
      operator_weight: 0.6
      operator_gate_z: 1.96
      operator_temperature: 0.25
      beta: 0.5
      local_gate_z: 1.28
      local_temperature: 1.0
      final_mass_bins: 2
      final_transform: background_cdf_power
      final_power: 10.0
      qscore_batch_size: 32768
      inference_batch_size: 16384
      support_guard:
        enabled: true
        statistic: radius_and_qscore
        mass_bins: 8
        gate_quantile: 0.999
        weight: 2.0
        temperature: 0.25
  mass_fraction:
    enabled: true
    control_points: 5
    smoothness: 0.0001
    variation: 0.0002
    damping: 0.5
    min_fraction: 0.00001
    max_fraction: 0.5
    max_iterations: 100
    update_mode: mean_matched
  initialization: background
  enhancements:
    rosenblatt: true
    guided_fit: true
    hard_bg: true
    contrastive_fit: true
    score_flow: false
    coherent_mixture: true
    guide_epochs: 20
    guide_warmup_epochs: 10
    hard_start_epoch: 5
    hard_pool_fraction: 0.25
    hard_sampling_fraction: 0.5
    contrastive_strength: 1.0
    contrastive_positive_weighted: true
    contrastive_negative_weighted: false
    score_flow_epochs: 60
    rosenblatt_bins: 12
    rosenblatt_hidden: 64
    rosenblatt_bound: 8.0
    guide_folds: 2
    guide_mass_conditioning: false
    guide_reference_multiplier: 1
    guide_refresh_reference: false
    guide_ratio_calibration: false
    responsibility_temperature: 1.0
    qphi_mass_bins: 1
    qphi_hidden_features: 64
    pseudo_sr_parallel_probes: 3
    tail_rank: true
    tail_candidate_multiplier: 8
    tail_hard_fraction: 0.01
    tail_strength: 0.005
    tail_margin: 0.0
    tail_temperature: 1.0
    tail_mass_bins: 8
  fit_recovery:
    max_retries: 2
    validation_sigma: 2.0
  flow:
    layers: 6
    hidden_features: 64
    num_blocks: 2
    use_residual_blocks: false
    use_batch_norm: true
    dropout_probability: 0.2
    activation: leaky_relu
    random_mask: true
    num_bins: 8
    tails: linear
    tail_bound: 8
    min_bin_width: 0.000001
    min_bin_height: 0.000001
    min_derivative: 0.000001
  training:
    batch_size: 256
    validation_batch_size: 1280
    learning_rate: 0.0003
    weight_decay: 0.01
    gradient_clip_norm: 1
    selected_checkpoints: 10
background:
  configuration:
    ModelType: MAF
    Transform: Affine
    num_inputs: 4
    num_cond_inputs: 1
    num_blocks: 15
    num_hidden: 128
    activation_function: relu
    pre_exp_tanh: false
    affine_log_scale_bound: 2.0
    batch_norm: true
    batch_norm_momentum: 1
    optimizer:
      name: Adam
      lr: 0.0001
      weight_decay: 0.000001
  epochs: 100
  batch_size: 256
  reference_samples: 267000
  mapping_validation_batch_size: 65536
  mapping_inference_batch_size: 65536
injection_scan:
  background_mode: retrain
  signal_events: [1000, 667, 500, 333, 250, 167, 83]
  seeds: [40, 41, 42, 43, 44]
