[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riddle-lhco"
version = "0.1.0"
description = "Independent LaCathode and RIDDLE LHCO pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
include = ["riddle*", "external", "external.lacathode_utils*", "external.ranode_utils*"]

[tool.setuptools.package-data]
"external.lacathode_utils" = ["source_hashes.json"]
"external.ranode_utils" = ["ranode.yaml"]

[tool.setuptools.data-files]
"config" = ["config/settings.yaml", "config/datasets.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
